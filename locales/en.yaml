clean_testdata: Clean Testdata
'Clean testdata: check and normalize the newline style (LF only) and the BOM header of problem testdata.': 'Clean testdata: check and normalize the newline style (LF only) and the BOM header of problem testdata.'
'Only domain root can see and use this tool. It never deletes testdata: binary files and UTF-16 encoded files are reported but never modified.': 'Only domain root can see and use this tool. It never deletes testdata: binary files and UTF-16 encoded files are reported but never modified.'
'This tool does not delete any testdata, and it only rewrites a file when a BOM header, CRLF or a lone CR is detected inside a text file.': 'This tool does not delete any testdata, and it only rewrites a file when a BOM header, CRLF or a lone CR is detected inside a text file.'
'The batch buttons only process the problems on the current page. Use the filter or paging to process more problems.': 'The batch buttons only process the problems on the current page. Use the filter or paging to process more problems.'
