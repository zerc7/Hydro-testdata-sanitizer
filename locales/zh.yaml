__langname: 简体中文
clean_testdata: 清洗测试数据
Clean Testdata: 清洗测试数据
'Clean testdata: check and normalize the newline style (LF only) and the BOM header of problem testdata.': 清洗测试数据：检查并统一题目测试数据的换行符（只保留 LF）与 BOM 头。
'Only domain root can see and use this tool. It never deletes testdata: binary files and UTF-16 encoded files are reported but never modified.': 仅域 root 可见可用。本工具不会删除任何测试数据：二进制文件与 UTF-16 编码文件只会被标记，不会被修改。
'This tool does not delete any testdata, and it only rewrites a file when a BOM header, CRLF or a lone CR is detected inside a text file.': 本工具不会删除测试数据，且只有在文本文件中检测到 BOM 头、CRLF 或单独的 CR 时才会重写该文件。
'The batch buttons only process the problems on the current page. Use the filter or paging to process more problems.': 批量操作只处理当前页面的题目，请配合筛选与翻页处理更多题目。
